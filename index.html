<!DOCTYPE html>
<html lang="el" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Μηνιαία Έξοδα Pro</title>

    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#5D5CDE' }
                }
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="NotoSans-Regular-normal.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.3/Sortable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        html, body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-full">

    <div class="container mx-auto p-4 max-w-lg">
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-6">Μηνιαία Έξοδα Pro</h1>
        
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-900 dark:text-white">Σύνολα</h2>
            <div class="grid grid-cols-2 gap-4 text-center">
                <div>
                    <div id="totalExpenses" class="text-2xl font-bold text-red-600 dark:text-red-400">0,00 €</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Εξοφλημένα</div>
                </div>
                <div>
                    <div id="pendingExpenses" class="text-2xl font-bold text-yellow-600 dark:text-yellow-400">0,00 €</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Εκκρεμή</div>
                </div>
            </div>
            <button id="btnManageExpenses" class="mt-4 w-full px-4 py-2 rounded-lg bg-primary text-white font-medium hover:bg-blue-600">Διαχείριση Εξόδων</button>
        </div>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold mb-4 text-gray-900 dark:text-white">Εξοφλημένα Έξοδα <span id="currentMonthDisplay"></span></h2>
            <ul id="currentMonthExpenses" class="divide-y divide-gray-200 dark:divide-gray-700">
                <li class="py-2 text-gray-500 dark:text-gray-400 text-center text-sm">Δεν υπάρχουν εξοφλημένα έξοδα για αυτόν τον μήνα.</li>
            </ul>
        </div>
    </div>
    
    <dialog id="manageExpensesDialog" class="p-6 rounded-xl shadow-2xl bg-white dark:bg-gray-800 backdrop:bg-black/50 w-full max-w-xl">
        <h2 class="text-2xl font-bold mb-4 text-gray-900 dark:text-white">Διαχείριση Όλων των Εξόδων</h2>
        <ul id="manageExpensesList" class="divide-y divide-gray-200 dark:divide-gray-700 max-h-96 overflow-y-auto mb-4">
            </ul>
        <div class="flex justify-between items-center">
            <button id="closeManageDialog" class="px-4 py-2 rounded-lg text-sm bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-white">Κλείσιμο</button>
            <button id="addNewExpense" class="px-4 py-2 rounded-lg text-sm bg-primary text-white hover:bg-blue-600">➕ Προσθήκη Νέου</button>
        </div>
    </dialog>
    
    <dialog id="reportingMonthDialog" class="p-6 rounded-lg shadow-xl bg-white dark:bg-gray-800 backdrop:bg-black/50 w-full max-w-sm">
        <h3 class="text-lg font-bold mb-4 text-gray-900 dark:text-white">Επιλογή Μήνα Αναφοράς</h3>
        <p id="dialogMessage" class="mb-6 text-gray-700 dark:text-gray-300">...</p>
        <div class="flex justify-end gap-3">
            <input type="hidden" id="expenseIdToPay" value=""> 

            <button id="btnCurrentMonth" type="button" class="px-4 py-2 rounded-lg text-sm bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-white">
                [Μήνας Εξόφλησης]
            </button>
            <button id="btnNextMonth" type="button" class="px-4 py-2 rounded-lg text-sm bg-primary text-white hover:bg-blue-600">
                [Επόμενος Μήνας]
            </button>
        </div>
    </dialog>

    <script>
        // Βοηθητική συνάρτηση για ευκολότερη πρόσβαση σε στοιχεία
        const el = id => document.getElementById(id);

        // Συνάρτηση μορφοποίησης νομίσματος
        const fmtEUR = amount => new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR' }).format(amount);
        
        // Υποθετική δομή δεδομένων (χρησιμοποιείται για το παράδειγμα)
        let expenses = [
            { id: 'e1', title: 'Ενοίκιο', amount: 450, dueDate: '2025-09-01', isPaid: true, paymentDate: '2025-09-03T10:00:00.000Z', reportingYear: 2025, reportingMonth: 8 }, // Σεπτέμβριος
            { id: 'e2', title: 'ΔΕΗ', amount: 80, dueDate: '2025-09-28', isPaid: false },
            { id: 'e3', title: 'Internet', amount: 30, dueDate: '2025-10-05', isPaid: false },
            { id: 'e4', title: 'Ασφάλεια', amount: 120, dueDate: '2025-08-30', isPaid: true, paymentDate: '2025-08-30T10:00:00.000Z', reportingYear: 2025, reportingMonth: 9 } // Πληρώθηκε 30/8, αλλά καταχωρήθηκε στον επόμενο (Σεπτέμβριο: 9)
        ];

        // ----------------------------------------------------
        // ΝΕΑ ΛΟΓΙΚΗ ΓΙΑ ΤΟ ΕΡΩΤΗΜΑ ΤΟΥ ΜΗΝΑ ΑΝΑΦΟΡΑΣ
        // ----------------------------------------------------

        /**
         * Επιστρέφει το όνομα του μήνα στα Ελληνικά.
         * @param {Date} date - Η ημερομηνία για την οποία θέλουμε το όνομα του μήνα.
         * @returns {string} Το όνομα του μήνα.
         */
        function getGreekMonthName(date) {
            const options = { month: 'long', timeZone: 'UTC' };
            const locale = 'el-GR';
            
            // Χρησιμοποιούμε toLocaleString για να πάρουμε το όνομα του μήνα στη σωστή γλώσσα (π.χ. "Σεπτέμβριος")
            const monthName = date.toLocaleDateString(locale, options);
            
            // Επιστρέφουμε το όνομα του μήνα με κεφαλαίο πρώτο γράμμα
            return monthName.charAt(0).toUpperCase() + monthName.slice(1);
        }
        
        /**
         * Ξεκινά τη διαδικασία εξόφλησης. Εάν η ημερομηνία είναι 27-31, ανοίγει το custom dialog.
         * @param {string} expenseId - Το ID του εξόδου προς εξόφληση.
         */
        function startPayExpense(expenseId) {
            const expense = expenses.find(e => e.id === expenseId);
            if (!expense || expense.isPaid) return;

            const paymentDate = new Date();
            const dayOfMonth = paymentDate.getDate();

            // 1. Ελέγχος: Εάν η πληρωμή έγινε 27-31
            if (dayOfMonth >= 27 && dayOfMonth <= 31) {
                
                // Υπολογισμός των ονομάτων των μηνών
                const nextMonthDate = new Date(paymentDate.getFullYear(), paymentDate.getMonth() + 1, 1);
                const currentMonthName = getGreekMonthName(paymentDate);
                const nextMonthName = getGreekMonthName(nextMonthDate);

                // Ενημέρωση του περιεχομένου του custom dialog
                el('dialogMessage').textContent = 
                    `Το έξοδο "${expense.title}" εξοφλείται σήμερα, ${dayOfMonth}/${paymentDate.getMonth() + 1}. ` +
                    `Σε ποιον μήνα θέλετε να καταχωρηθεί λογιστικά;`;
                    
                el('btnCurrentMonth').textContent = currentMonthName;
                el('btnNextMonth').textContent = nextMonthName;
                
                // Αποθήκευση του ID και εμφάνιση του dialog
                el('expenseIdToPay').value = expenseId;
                el('reportingMonthDialog').showModal();
                
            } else {
                // 2. Εάν η πληρωμή έγινε 1-26, προχωράμε κατευθείαν στον ΤΡΕΧΟΝΤΑ μήνα
                finalizePayment(expenseId, paymentDate, false);
            }
        }

        /**
         * Ολοκληρώνει την καταχώρηση της πληρωμής με βάση την επιλογή του χρήστη.
         * @param {string} expenseId - Το ID του εξόδου.
         * @param {Date} paymentDate - Η πραγματική ημερομηνία πληρωμής.
         * @param {boolean} shiftToNextMonth - True αν πρέπει να μετακινηθεί στον επόμενο μήνα.
         */
        function finalizePayment(expenseId, paymentDate, shiftToNextMonth) {
            const expense = expenses.find(e => e.id === expenseId);
            if (!expense || expense.isPaid) return;
            
            let reportingYear = paymentDate.getFullYear();
            let reportingMonth = paymentDate.getMonth(); // 0-11
            
            // Εάν ο χρήστης επέλεξε τον επόμενο μήνα
            if (shiftToNextMonth) {
                const nextMonthDate = new Date(paymentDate.getFullYear(), paymentDate.getMonth() + 1, 1);
                reportingYear = nextMonthDate.getFullYear();
                reportingMonth = nextMonthDate.getMonth();
            }
            
            // Ενημέρωση του αντικειμένου εξόδου
            expense.isPaid = true;
            expense.paymentDate = paymentDate.toISOString(); 
            expense.reportingYear = reportingYear;           
            expense.reportingMonth = reportingMonth;         

            // 3. Ανανέωση του UI και αποθήκευση (Υποθετικές κλήσεις)
            // saveExpenses(expenses); 
            renderAll(); 
            
            // Κλείσιμο του διαλόγου αν είναι ανοιχτός
            el('reportingMonthDialog').close(); 
        }

        // ----------------------------------------------------
        // ΛΟΓΙΚΗ ΓΙΑ ΤΗ ΔΙΑΧΕΙΡΙΣΗ ΚΑΙ ΤΟ RENDERING ΤΟΥ UI
        // ----------------------------------------------------

        // Ρυθμίζει τους listeners για τα κουμπιά του custom dialog
        function setupReportingDialogListeners() {
            el('btnCurrentMonth').addEventListener('click', () => {
                const expenseId = el('expenseIdToPay').value;
                finalizePayment(expenseId, new Date(), false); // Χωρίς shift
            });

            el('btnNextMonth').addEventListener('click', () => {
                const expenseId = el('expenseIdToPay').value;
                finalizePayment(expenseId, new Date(), true); // Με shift στον επόμενο
            });
        }
        
        // Φορτώνει τη λίστα εξόδων στον διάλογο διαχείρισης
        function renderManageExpenses() {
            const list = el('manageExpensesList');
            list.innerHTML = ''; 
            
            // Ταξινομούμε: Εκκρεμή πρώτα
            const sortedExpenses = [...expenses].sort((a, b) => a.isPaid - b.isPaid);

            sortedExpenses.forEach(exp => {
                const li = document.createElement('li');
                const d = new Date(exp.dueDate).toLocaleDateString('el-GR');
                
                let paidStatusHTML;
                if (exp.isPaid) {
                    const rDate = new Date(exp.reportingYear, exp.reportingMonth);
                    const rMonthName = getGreekMonthName(rDate);
                    paidStatusHTML = `<span class="text-xs font-semibold text-green-600">✅ Εξοφλ. (${rMonthName})</span>`;
                } else {
                    paidStatusHTML = `<button class="pay-expense px-2 py-1 rounded bg-green-500 text-white text-xs" data-id="${exp.id}">💰 Εξόφληση</button>`;
                }

                li.className = "flex justify-between items-center p-3 hover:bg-gray-50 dark:hover:bg-gray-800";
                li.innerHTML = `
                    <div>
                        <div class="font-medium ${exp.isPaid ? 'line-through text-gray-400' : 'text-gray-900 dark:text-white'}">${exp.title}</div>
                        <div class="text-sm text-gray-500">${fmtEUR(exp.amount)} • Λήξη: ${d}</div>
                    </div>
                    <div class="flex gap-2 items-center">
                        ${paidStatusHTML}
                        <button class="edit-expense px-2 py-1 rounded bg-blue-500 text-white text-xs" data-id="${exp.id}">✏️ Επεξεργασία</button>
                        <button class="delete-expense px-2 py-1 rounded bg-red-500 text-white text-xs" data-id="${exp.id}">🗑️ Διαγραφή</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // Φορτώνει τα συνολικά έξοδα και τη λίστα του τρέχοντος μήνα
        function renderDashboard() {
            const today = new Date();
            const currentReportingYear = today.getFullYear();
            const currentReportingMonth = today.getMonth(); // 0-11
            
            // Εμφάνιση ονόματος μήνα στον τίτλο
            el('currentMonthDisplay').textContent = `(${getGreekMonthName(today)})`;

            let totalPaid = 0;
            let totalPending = 0;
            const currentMonthList = el('currentMonthExpenses');
            currentMonthList.innerHTML = '';
            
            let monthExpensesFound = false;

            expenses.forEach(exp => {
                if (exp.isPaid) {
                    if (exp.reportingYear === currentReportingYear && exp.reportingMonth === currentReportingMonth) {
                         // Εμφανίζεται στη λίστα του τρέχοντος μήνα
                        totalPaid += exp.amount;
                        monthExpensesFound = true;
                        
                        const li = document.createElement('li');
                        li.className = "flex justify-between items-center py-2";
                        li.innerHTML = `
                            <span class="font-medium">${exp.title}</span>
                            <span class="font-semibold text-red-600">${fmtEUR(exp.amount)}</span>
                        `;
                        currentMonthList.appendChild(li);
                    } else {
                        // Συμπεριλαμβάνεται στα συνολικά, αλλά όχι στη λίστα του μήνα
                        totalPaid += exp.amount; 
                    }
                } else {
                    totalPending += exp.amount;
                }
            });

            if (!monthExpensesFound) {
                currentMonthList.innerHTML = '<li class="py-2 text-gray-500 dark:text-gray-400 text-center text-sm">Δεν υπάρχουν εξοφλημένα έξοδα για αυτόν τον μήνα.</li>';
            }

            // Ενημέρωση συνολικών
            el('totalExpenses').textContent = fmtEUR(totalPaid);
            el('pendingExpenses').textContent = fmtEUR(totalPending);
        }

        // Συνάρτηση για ανανέωση όλων των στοιχείων
        function renderAll() {
            renderDashboard();
            renderManageExpenses();
        }

        // ----------------------------------------------------
        // LISTENERS
        // ----------------------------------------------------

        // Άνοιγμα Διαλόγου Διαχείρισης Εξόδων
        el('btnManageExpenses').addEventListener('click', () => {
            renderManageExpenses();
            el('manageExpensesDialog').showModal();
        });
        
        // Κλείσιμο Διαλόγου Διαχείρισης
        el('closeManageDialog').addEventListener('click', () => {
            el('manageExpensesDialog').close();
        });

        // Ενέργειες στη λίστα Διαχείρισης (για Εξόφληση, Επεξεργασία, Διαγραφή)
        el('manageExpensesList').addEventListener('click', (e) => {
            const target = e.target;
            const expenseId = target.dataset.id;
            
            // ΝΕΟ: Έλεγχος για κουμπί Εξόφλησης
            if (target.classList.contains('pay-expense')) {
                startPayExpense(expenseId); // Καλούμε τη νέα λογική
            } 
            // Υποθετική λογική για άλλα κουμπιά
            else if (target.classList.contains('edit-expense')) {
                console.log(`Επεξεργασία εξόδου: ${expenseId}`);
                // openEditDialog(expenseId);
            } 
            else if (target.classList.contains('delete-expense')) {
                if (confirm('Είστε σίγουρος/η ότι θέλετε να διαγράψετε αυτό το έξοδο;')) {
                    console.log(`Διαγραφή εξόδου: ${expenseId}`);
                    // deleteExpense(expenseId);
                }
            }
        });
        
        // Εκκίνηση της εφαρμογής
        document.addEventListener('DOMContentLoaded', () => {
            setupReportingDialogListeners();
            renderAll();
        });

    </script>
</body>
</html>
